behaviors:
  CarAgentBrain:
    trainer_type: ppo # or sac
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128 # or 256
      num_layers: 2 # or 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000 # Total steps for training
    time_horizon: 64
    summary_freq: 10000
engine_settings:
  width: 1600
  height: 900
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
